version: '3.8'

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: global_horizon_dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./dashboard:/app/dashboard
    environment:
      - STREAMLIT_ENV=production
    restart: unless-stopped

  # Optional: Uncomment below to run an instance of SQL Server 2022 locally
